worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 512;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 10s;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_x_real_ip $client {
        "" $binary_remote_addr;
        default $http_x_real_ip;
    }
    limit_req_zone $client zone=auth:1m rate=12r/m;
    limit_req_zone $client zone=api:1m rate=10r/s;
    limit_req_zone $client zone=games:1m rate=12r/m;
    limit_req_status 429;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;

        proxy_set_header Host backend;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        location ~ ^/api/auth/(register|login)$ {
            limit_req zone=auth burst=15 nodelay;
            proxy_pass http://backend:8080;
        }
        location = /api/games {
            limit_req zone=games burst=8 nodelay;
            proxy_pass http://backend:8080;
        }
        location /api/ {
            limit_req zone=api burst=32 nodelay;
            proxy_pass http://backend:8080;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
